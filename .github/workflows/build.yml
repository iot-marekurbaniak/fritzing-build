---
name: Build unsigned Fritzing
on:
  workflow_dispatch:
  push:
    paths: ['versions.lock.json', 'scripts/**', '.github/workflows/build.yml']
permissions:
  contents: read
env:
  QT_VERSION: 6.8.3
  AQT_VERSION: 3.3.0
  # pri/gitversion.pri in fritzing-app embeds "CD-<this>-0-<sha>" as the git version when CI is set.
  TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  windows-x64:
    name: fritzing-windows-x64
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-${{ hashFiles('versions.lock.json') }}
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==$env:AQT_VERSION"
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qt5compat qtserialport
      - name: Export QT_ROOT
        shell: pwsh
        run: '"QT_ROOT=$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64" | Out-File -Append $env:GITHUB_ENV'
      - name: Cache built dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/fritzing/libgit2-1.7.1
            ${{ runner.temp }}/fritzing/quazip-6.8.3-1.4intuisphere
            ${{ runner.temp }}/fritzing/zlib-1.3.1
            ${{ runner.temp }}/fritzing/Clipper1-6.4.2
          key: deps-windows-x64-${{ hashFiles('versions.lock.json', 'scripts/bootstrap-windows.ps1', 'scripts/msvc-env.ps1') }}
      - name: Dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1 "$env:RUNNER_TEMP/fritzing" "$pwd/out"
      - uses: actions/upload-artifact@v7
        with:
          name: fritzing-windows-x64
          path: out/fritzing-windows-x64-unsigned.zip
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            arch: arm64
          - target: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-clang_64-${{ hashFiles('versions.lock.json') }}
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall==$AQT_VERSION"
          aqt install-qt mac desktop "$QT_VERSION" clang_64 --outputdir "$RUNNER_TEMP/Qt" --modules qt5compat qtserialport
      - name: Export QT_ROOT
        run: echo "QT_ROOT=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
      - name: Cache built dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/fritzing/libgit2-1.7.1
            ${{ runner.temp }}/fritzing/quazip-6.8.3-1.4intuisphere
            ${{ runner.temp }}/fritzing/Clipper1-6.4.2
            ${{ runner.temp }}/fritzing/ngspice-42-runtime-${{ matrix.arch }}
          key: deps-${{ matrix.target }}-${{ hashFiles('versions.lock.json', 'scripts/bootstrap-macos.sh') }}
      - name: Dependencies
        run: ./scripts/bootstrap-macos.sh
      - name: Build
        run: ./scripts/build-macos.sh "$RUNNER_TEMP/fritzing" "${{ matrix.arch }}" "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: fritzing-${{ matrix.target }}
          path: out/fritzing-${{ matrix.target }}-unsigned.zip
          if-no-files-found: error
